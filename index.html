<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Caja de herramientas gratuitas para emprendedores y freelancers: calculadora de IVA, conversor de tasas BCV/USDT, optimizador de imágenes, generador de QR y cotizador de servicios." />
    <title>AD·Tools — Herramientas para emprendedores</title>
    <meta name="theme-color" content="#16120c" />
    <meta name="author" content="Alejandro Danieles" />
    <!-- Open Graph / redes sociales. og:image relativo funciona en la mayoría
         de scrapers; al desplegar, cambiar por la URL absoluta del dominio. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="AD·Tools" />
    <meta property="og:title" content="AD·Tools — Herramientas gratis para freelancers" />
    <meta
      property="og:description"
      content="Calculadora de IVA con tasas BCV en vivo, conversor de divisas, optimizador de imágenes, QR con tu marca, cotizador y más. Sin registro: todo corre en tu navegador."
    />
    <meta property="og:image" content="/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:locale" content="es_VE" />
    <meta property="og:locale:alternate" content="en_US" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="AD·Tools — Herramientas gratis para freelancers" />
    <meta
      name="twitter:description"
      content="Calculadora de IVA con tasas BCV en vivo, conversor de divisas, optimizador de imágenes, QR con tu marca, cotizador y más. Sin registro: todo corre en tu navegador."
    />
    <meta name="twitter:image" content="/og-image.png" />
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "AD·Tools — Tool Kit",
        "description": "Caja de herramientas gratuitas para freelancers y emprendedores: calculadora de IVA, tasas de cambio BCV, optimizador de imágenes, generador de QR, cotizador de servicios, acuerdos y texto para redes.",
        "applicationCategory": "BusinessApplication",
        "operatingSystem": "Web",
        "inLanguage": ["es", "en"],
        "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" },
        "author": { "@type": "Person", "name": "Alejandro Danieles", "url": "https://alejandrodanieles.com" }
      }
    </script>
    <link rel="icon" type="image/svg+xml" href="/logo-mark-light.svg" media="(prefers-color-scheme: light)" />
    <link rel="icon" type="image/svg+xml" href="/logo-mark-dark.svg" media="(prefers-color-scheme: dark)" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <script>
      try {
        var t = localStorage.getItem('adtools-theme');
        if (t === 'dark' || (!t && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
          document.documentElement.classList.add('dark');
        }
      } catch (e) {}
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
